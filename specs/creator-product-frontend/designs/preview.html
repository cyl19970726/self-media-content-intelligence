<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Phase 1 · v2 设计方向图 · 四页并排预览</title>
<style>
  :root { --paper:#f3f0e8; --ink:#171713; --teal:#2e6b4f; --orange:#e4572e; --line:rgba(23,23,19,.18); }
  body { margin:0; background:var(--paper); color:var(--ink); font-family:"IBM Plex Sans Condensed",system-ui,sans-serif; }
  header { padding:22px 28px; border-bottom:1px solid var(--ink); display:flex; justify-content:space-between; align-items:center; }
  header h1 { margin:0; font-size:20px; letter-spacing:.02em; }
  header small { font-family:"IBM Plex Mono",monospace; font-size:11px; color:#66706c; }
  main { padding:26px; display:grid; grid-template-columns:1fr; gap:26px; }
  figure { margin:0; border:1px solid var(--ink); background:#fff; }
  figcaption { padding:12px 16px; border-top:1px solid var(--ink); display:flex; justify-content:space-between; font-family:"IBM Plex Mono",monospace; font-size:11px; }
  figcaption b { color:var(--teal); }
  img { display:block; width:100%; height:auto; }
  .note { padding:0 2px 26px; color:#66706c; font-size:13px; }
  .note b { color:var(--orange); }
</style>
</head>
<body>
<header><h1>Phase 1 · v2 设计方向图（DRAFT 待 Owner 选定）</h1><small>四张同一套设计语言 · 1440×960 · v1 已标 DEAD（dead-v1/）</small></header>
<main>
  <figure><img src="direction-v2-1-overview.png" alt="v2 direction 1 overview"/><figcaption><b>V2 · 01</b><span>博主总览页 /creators</span></figcaption></figure>
  <figure><img src="direction-v2-2-creator.png" alt="v2 direction 2 creator"/><figcaption><b>V2 · 02</b><span>博主页研究台 /creators/:id（核心页）</span></figcaption></figure>
  <figure><img src="direction-v2-3-benchmark.png" alt="v2 direction 3 benchmark"/><figcaption><b>V2 · 03</b><span>跨 IP 对比台 /benchmark</span></figcaption></figure>
  <figure><img src="direction-v2-4-video.png" alt="v2 direction 4 video"/><figcaption><b>V2 · 04</b><span>视频证据页 /creators/:id/videos/:videoId</span></figcaption></figure>
  <p class="note"><b>判断权在 Owner：</b>按方向/风格/密度/层级选——选定即冻结唯一真源，落选标 DEAD。AI 出稿草图，中文可能有错字、细节可能粗糙，选的是方向不是像素。</p>
</main>
</body>
</html>
