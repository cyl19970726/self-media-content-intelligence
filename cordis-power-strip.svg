<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 920" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
    <marker id="arrV" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arrA" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#b45309"/>
    </marker>
  </defs>

  <rect width="1180" height="920" fill="#ffffff"/>
  <text x="20" y="34" font-size="24" font-weight="bold" fill="#0f172a">Cordis 大白话图:插线板 + 总台 —— 用 DeepSeek Harness 实景说明</text>
  <text x="20" y="56" font-size="13" fill="#64748b">每个功能是一个插头;模块互相不 import,只报插孔名;总台负责:登记、等人齐叫醒、拔插头前逆序收摊。</text>

  <!-- ① 插线板 -->
  <rect x="20" y="75" width="1140" height="255" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <path d="M20,83 a8,8 0 0 1 8,-8 h1124 a8,8 0 0 1 8,8 v26 h-1140 z" fill="#475569"/>
  <text x="36" y="102" font-size="14" font-weight="bold" fill="#ffffff">① 插线板 = 运行中的 dsh(每行 cordis.yml = 插一个插头 + 给一份配置)</text>

  <rect x="40" y="120" width="1100" height="115" rx="10" fill="#1e293b"/>
  <text x="69" y="142" font-size="12" fill="#94a3b8">▏总台登记册:谁在哪个孔 · 谁在等哪个孔 · 谁借了什么</text>

  <g font-weight="bold">
    <rect x="69" y="150" width="118" height="56" rx="6" fill="#fbbf24"/><text x="128" y="172" text-anchor="middle" font-size="14" fill="#78350f">llm</text><text x="128" y="192" text-anchor="middle" font-size="9" font-family="SF Mono, Menlo, monospace" fill="#92400e">dsh-llm-deepseek</text>
    <rect x="201" y="150" width="118" height="56" rx="6" fill="#fbbf24"/><text x="260" y="172" text-anchor="middle" font-size="14" fill="#78350f">fs</text><text x="260" y="192" text-anchor="middle" font-size="9" font-family="SF Mono, Menlo, monospace" fill="#92400e">dsh-fs-sandbox</text>
    <rect x="333" y="150" width="118" height="56" rx="6" fill="#fbbf24"/><text x="392" y="172" text-anchor="middle" font-size="14" fill="#78350f">tools</text><text x="392" y="192" text-anchor="middle" font-size="9" font-family="SF Mono, Menlo, monospace" fill="#92400e">dsh-tools</text>
    <rect x="465" y="150" width="118" height="56" rx="6" fill="#fbbf24"/><text x="524" y="172" text-anchor="middle" font-size="14" fill="#78350f">agents</text><text x="524" y="192" text-anchor="middle" font-size="9" font-family="SF Mono, Menlo, monospace" fill="#92400e">dsh-agent</text>
    <rect x="597" y="150" width="118" height="56" rx="6" fill="#fbbf24"/><text x="656" y="172" text-anchor="middle" font-size="14" fill="#78350f">sessions</text><text x="656" y="192" text-anchor="middle" font-size="9" font-family="SF Mono, Menlo, monospace" fill="#92400e">dsh-session</text>
    <rect x="729" y="150" width="118" height="56" rx="6" fill="#fbbf24"/><text x="788" y="172" text-anchor="middle" font-size="14" fill="#78350f">systemPrompt</text><text x="788" y="192" text-anchor="middle" font-size="8.5" font-family="SF Mono, Menlo, monospace" fill="#92400e">dsh-system-prompt</text>
    <rect x="861" y="150" width="118" height="56" rx="6" fill="#fbbf24"/><text x="920" y="172" text-anchor="middle" font-size="14" fill="#78350f">sandbox</text><text x="920" y="192" text-anchor="middle" font-size="9" font-family="SF Mono, Menlo, monospace" fill="#92400e">dsh-sandbox-local</text>
    <rect x="993" y="150" width="118" height="56" rx="6" fill="#fbbf24"/><text x="1052" y="172" text-anchor="middle" font-size="14" fill="#78350f">approval</text><text x="1052" y="192" text-anchor="middle" font-size="9" font-family="SF Mono, Menlo, monospace" fill="#92400e">dsh-user-approval</text>
  </g>
  <text x="69" y="227" font-size="12" fill="#94a3b8">插孔名 = ctx.llm / ctx.fs / ctx.tools …;用家写 ctx.fs 借东西,不 import 任何具体模块</text>

  <rect x="40" y="250" width="600" height="70" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="52" y="267" font-size="11" font-family="SF Mono, Menlo, monospace" fill="#334155">- id: llm-deepseek                  ← 插孔 id</text>
  <text x="52" y="282" font-size="11" font-family="SF Mono, Menlo, monospace" fill="#334155">  name: '@deepseek-ai/dsh-llm-deepseek'  ← 插头</text>
  <text x="52" y="297" font-size="11" font-family="SF Mono, Menlo, monospace" fill="#334155">  config: { thinking: enabled }    ← 配置</text>
  <text x="52" y="312" font-size="11" fill="#475569">profile 按序叠加 bundle + patch = 最终接线表(dsh --dump-config 可打印)</text>

  <text x="670" y="272" font-size="12.5" fill="#0f172a">· 没有 main()、没有组装代码:一张 YAML 就是接线图</text>
  <text x="670" y="293" font-size="12.5" fill="#0f172a">· 同一个孔可以换插头:本地 ⇄ 沙箱 ⇄ 远程(E2B)</text>
  <text x="670" y="314" font-size="12.5" fill="#0f172a">· 配置传错?启动即报错,Config schema 校验</text>

  <!-- ② 等人齐 -->
  <rect x="20" y="345" width="560" height="255" rx="8" fill="#f8fafc" stroke="#c4b5fd" stroke-width="1.5"/>
  <path d="M20,353 a8,8 0 0 1 8,-8 h544 a8,8 0 0 1 8,8 v26 h-560 z" fill="#6d28d9"/>
  <text x="36" y="374" font-size="14" font-weight="bold" fill="#ffffff">② 大脑也在插线板上:五样东西齐了才醒</text>

  <rect x="45" y="405" width="200" height="80" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="62" y="430" font-size="14" font-weight="bold" fill="#4c1d95">AgentLoop(大脑)</text>
  <text x="62" y="451" font-size="12" fill="#6d28d9">inject = 5 个插孔名</text>
  <text x="62" y="472" font-size="12" fill="#6d28d9">zzz… 睡觉(PENDING)</text>

  <path d="M245,485 L268,485 L286,420 M268,485 L286,448 M268,485 L286,476 M268,485 L286,504 M268,485 L286,532" fill="none" stroke="#7c3aed" stroke-width="1.2"/>
  <g font-size="12" fill="#0f172a">
    <rect x="288" y="408" width="240" height="24" rx="5" fill="#f5f3ff" stroke="#c4b5fd"/><text x="298" y="425">agents ✓</text>
    <rect x="288" y="436" width="240" height="24" rx="5" fill="#f5f3ff" stroke="#c4b5fd"/><text x="298" y="453">sessions ✓</text>
    <rect x="288" y="464" width="240" height="24" rx="5" fill="#f5f3ff" stroke="#c4b5fd"/><text x="298" y="481">llm ✓</text>
    <rect x="288" y="492" width="240" height="24" rx="5" fill="#f5f3ff" stroke="#c4b5fd"/><text x="298" y="509">tools ✓</text>
    <rect x="288" y="520" width="240" height="24" rx="5" fill="#f5f3ff" stroke="#c4b5fd"/><text x="298" y="537">systemPrompt ✓</text>
  </g>

  <text x="36" y="568" font-size="12.5" fill="#334155">缺一个插孔 → 一直睡(PENDING),一个字都不跑</text>
  <text x="36" y="589" font-size="12.5" fill="#334155">五孔全齐 → 总台叫醒:LOADING → ACTIVE(开工)</text>

  <!-- ③ 借条 -->
  <rect x="600" y="345" width="560" height="255" rx="8" fill="#f8fafc" stroke="#fca5a5" stroke-width="1.5"/>
  <path d="M600,353 a8,8 0 0 1 8,-8 h544 a8,8 0 0 1 8,8 v26 h-560 z" fill="#b91c1c"/>
  <text x="616" y="374" font-size="14" font-weight="bold" fill="#ffffff">③ 借条制度:拔插头前,逆序还清每一笔</text>

  <text x="616" y="398" font-size="12.5" fill="#0f172a">醒着时干的每件事,总台记一张借条:</text>
  <g font-size="11" font-family="SF Mono, Menlo, monospace" fill="#7f1d1d">
    <rect x="616" y="406" width="250" height="32" rx="6" fill="#fef2f2" stroke="#fca5a5"/><text x="628" y="426">① ctx.on('tools/pre-execute')</text>
    <rect x="616" y="446" width="250" height="32" rx="6" fill="#fef2f2" stroke="#fca5a5"/><text x="628" y="466">② ctx.provide('agentLoop')</text>
    <rect x="616" y="486" width="250" height="32" rx="6" fill="#fef2f2" stroke="#fca5a5"/><text x="628" y="506">③ ctx.effect(开定时器)</text>
  </g>

  <g font-size="12.5" fill="#0f172a">
    <text x="892" y="425">· 拔掉 llm 插头</text>
    <text x="892" y="465">· 总台广播:你的依赖变了</text>
    <text x="892" y="505">· 按借条逆序还账:③ → ② → ①</text>
    <text x="892" y="545">· 回到 PENDING(睡觉)</text>
  </g>

  <text x="616" y="588" font-size="12" fill="#64748b">这就是 DSH 敢热重载、敢让 agent 改自己插件的底气。</text>

  <!-- ④ 换插头 -->
  <rect x="20" y="615" width="560" height="250" rx="8" fill="#f8fafc" stroke="#6ee7b7" stroke-width="1.5"/>
  <path d="M20,623 a8,8 0 0 1 8,-8 h544 a8,8 0 0 1 8,8 v26 h-560 z" fill="#047857"/>
  <text x="36" y="644" font-size="14" font-weight="bold" fill="#ffffff">④ 换插头 = 换产品(seam)</text>

  <rect x="60" y="660" width="190" height="60" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="75" y="688" font-size="14" font-weight="bold" fill="#065f46">插孔: ctx.fs</text>
  <text x="75" y="708" font-size="11" fill="#047857">大家只认孔名,不认插头</text>
  <rect x="60" y="740" width="190" height="36" rx="6" fill="#d1fae5" stroke="#059669"/><text x="75" y="763" font-size="12" fill="#064e3b">dsh-fs-local(本地)</text>
  <rect x="60" y="790" width="190" height="36" rx="6" fill="#fef3c7" stroke="#d97706"/><text x="75" y="813" font-size="12" fill="#78350f">dsh-fs-sandbox(沙箱)</text>
  <path d="M250,758 C 274,770 274,798 250,808" fill="none" stroke="#b45309" stroke-width="1.5" marker-end="url(#arrA)"/>
  <text x="262" y="788" font-size="11" fill="#b45309">换成</text>

  <text x="300" y="678" font-size="13" font-weight="bold" fill="#0f172a">用家(只认孔,不认插头):</text>
  <text x="300" y="700" font-size="12.5" fill="#0f172a">· bash 执行器 dsh-bash-sandbox</text>
  <text x="300" y="722" font-size="12.5" fill="#0f172a">· 文件工具 read / write / edit</text>
  <text x="300" y="744" font-size="12.5" fill="#0f172a">· LSP 语言服务</text>
  <text x="300" y="776" font-size="12.5" fill="#334155">把 local 拔掉、换成 sandbox →</text>
  <text x="300" y="798" font-size="12.5" fill="#334155">上面三个用家一行代码没改,</text>
  <text x="300" y="820" font-size="12.5" fill="#334155">行为全变:写被拦、读受限。</text>
  <text x="300" y="849" font-size="12" fill="#64748b">沙箱 / 远程 / 测试桩 = 同孔不同插头</text>

  <!-- ⑤ 传话 -->
  <rect x="600" y="615" width="560" height="250" rx="8" fill="#f8fafc" stroke="#fcd34d" stroke-width="1.5"/>
  <path d="M600,623 a8,8 0 0 1 8,-8 h544 a8,8 0 0 1 8,8 v26 h-560 z" fill="#b45309"/>
  <text x="616" y="644" font-size="14" font-weight="bold" fill="#ffffff">⑤ 传话游戏(waterfall)= 审批的实现</text>

  <rect x="620" y="662" width="240" height="36" rx="6" fill="#ffffff" stroke="#475569"/><text x="632" y="684" font-size="12.5" fill="#0f172a">模型:我要跑 bash</text>
  <line x1="740" y1="698" x2="740" y2="708" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="620" y="712" width="240" height="36" rx="6" fill="#fffbeb" stroke="#d97706"/><text x="632" y="734" font-size="12.5" fill="#78350f">听众① approval 插件</text>
  <line x1="740" y1="748" x2="740" y2="758" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="620" y="762" width="240" height="36" rx="6" fill="#fffbeb" stroke="#d97706"/><text x="632" y="784" font-size="12.5" fill="#78350f">听众② sandbox 插件</text>
  <line x1="740" y1="798" x2="740" y2="808" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="620" y="812" width="240" height="36" rx="6" fill="#ecfdf5" stroke="#059669"/><text x="632" y="834" font-size="12.5" fill="#064e3b">真正执行命令</text>

  <g font-size="12.5" fill="#0f172a">
    <text x="890" y="682">传话规则(waterfall):</text>
    <text x="890" y="704">· 收到话,喊 next() → 传给下一个</text>
    <text x="890" y="726">· 不喊 next() → 链条断 = 否决</text>
  </g>
  <g font-size="12.5">
    <text x="890" y="766" fill="#b45309">policy = ask → 停!先问人 ✋</text>
    <text x="890" y="826" fill="#047857">policy = never → 过!→ 传下去</text>
  </g>
  <text x="616" y="858" font-size="11" fill="#64748b">审批 = 换 approval 插头的 config,循环代码一行不动</text>

  <!-- 收尾 -->
  <rect x="20" y="878" width="1140" height="36" rx="8" fill="#0f172a"/>
  <text x="590" y="901" text-anchor="middle" font-size="13.5" fill="#e2e8f0">一句话:每个功能是一个插头;模块只认插孔名、互相不 import;依赖齐了总台叫醒你,拔插头前按借条逆序收摊 —— 改产品 = 换插头 / 改接线表。</text>
</svg>
